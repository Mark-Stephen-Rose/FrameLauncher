<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Frame Launcher</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html{font-size:1.5625vw}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101315;color:#f4f1e9;font-family:"Segoe UI",Roboto,Arial,sans-serif;--focus:1.1}
body.light{color:#191c20}

/* ---------- background + clock ---------- */
#bg{position:fixed;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 10%,#34403f 0%,#1b2326 45%,#101315 100%);background-size:cover;background-position:center}
#clock{position:absolute;left:4rem;top:3rem;z-index:1;color:#f4f1e9;text-shadow:0 2px 18px #0005}
#clock:before{content:"";position:absolute;left:-4rem;right:-4rem;top:-3rem;bottom:-3rem;z-index:-1;pointer-events:none;background:radial-gradient(ellipse closest-side at 50% 50%,rgba(0,0,0,var(--ca,0)) 0%,rgba(0,0,0,var(--ca,0)) 35%,rgba(0,0,0,0) 100%)}
body.clk-dark #clock{color:#191c20;text-shadow:0 1px 14px #fff6}
body.clk-dark #clock:before{background:radial-gradient(ellipse closest-side at 50% 50%,rgba(255,255,255,var(--ca,0)) 0%,rgba(255,255,255,var(--ca,0)) 35%,rgba(255,255,255,0) 100%)}
#t{font-size:5rem;font-weight:200;letter-spacing:-.03em;line-height:1}
#d{display:block;margin-top:.6rem;font-size:1.1rem;opacity:.8}
/* the clock only belongs on the home screen; other screens would draw over it */
body:not(.scr-home) #clock{display:none}
body.noclock #t{display:none}
body.nodate #d{display:none}
body.noclock #d{margin-top:0;font-size:1.6rem;opacity:.9}
body.noclock.nodate #clock{display:none}

/* ---------- art mode: full-screen wallpaper with a small clock ---------- */
#art{display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:#000}
.al{position:absolute;left:0;top:0;right:0;bottom:0;background-size:cover;background-position:center;background-repeat:no-repeat}
#al1{opacity:0;transition:opacity 2.5s ease-in-out}
#artclock{position:absolute;color:#f4f1e9;padding:.7rem 1.3rem;border-radius:1rem;background:rgba(0,0,0,.4);text-shadow:0 1px 8px #0008;text-align:center}
#artclock .at{font-size:2.4rem;font-weight:300;line-height:1}
#artclock .ad{font-size:.9rem;opacity:.85;margin-top:.35rem}
#artclock.c0{right:3rem;bottom:2.5rem}#artclock.c1{left:3rem;bottom:2.5rem}#artclock.c2{left:3rem;top:2.5rem}#artclock.c3{right:3rem;top:2.5rem}

/* ---------- VPN status pill (home screen, top right; bottom right when the dock is at the top) ---------- */
#vpn{display:none;position:absolute;right:3rem;top:3rem;z-index:1;align-items:center;gap:.6rem;padding:.5rem 1.1rem;border-radius:2rem;background:rgba(0,0,0,.45);color:#f4f1e9;font-size:1rem;text-shadow:0 1px 6px #0008}
body.vpnon.scr-home #vpn{display:flex}
body.dp-top:not(.listMode) #vpn{top:auto;bottom:3rem}
.vd{width:.7rem;height:.7rem;border-radius:50%;background:#9aa4aa;flex-shrink:0}
#vpn.on .vd{background:#4cd37b}#vpn.off .vd{background:#f0a030}

/* ---------- tiles ---------- */
.tile{display:inline-block;width:9rem;margin-right:.8rem;text-align:center;vertical-align:top;opacity:.72;transition:transform .15s,opacity .15s;white-space:normal}
.tile.f{opacity:1;transform:scale(var(--focus))}
.ic{width:5rem;height:5rem;margin:0 auto .65rem;border-radius:1rem;background:rgba(255,255,255,.12);overflow:hidden;line-height:5rem;font-size:2.2rem;font-weight:300;box-shadow:0 .6rem 1.5rem #0002}
.ic img{width:100%;height:100%;display:block;object-fit:contain}
.nm{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 6px #0008}
.bannerMode .tile{width:12rem}
.bannerMode .ic{width:11rem;height:5.8rem;border-radius:.65rem}
.bannerMode .ic img.bn{object-fit:cover}
.bannerMode .ic img.ico{object-fit:contain;padding:.45rem;box-sizing:border-box}
.noicons .ic{display:none}
.nonames .nm{display:none}

/* ---------- home: dock / list ---------- */
#dock{display:none;position:absolute;left:3rem;right:3rem;bottom:3.5rem;overflow:hidden}
body.scr-home #dock{display:block}
#track{position:relative;white-space:nowrap;padding:calc(.9rem + (var(--focus) - 1) * 5rem) calc(.8rem + (var(--focus) - 1) * 6rem);transition:transform .25s ease-out;will-change:transform}
.listMode #dock{top:13rem;bottom:2.5rem;left:4rem;right:auto;width:24rem}   /* about a third of the screen, so the photo shows */
body.listMode.lp-center #dock{left:50%;margin-left:-12rem}
body.listMode.lp-right #dock{left:auto;right:4rem}
.listMode #track{white-space:normal;padding:.6rem}
.listMode .tile{display:flex;width:100%;height:3.5rem;align-items:center;text-align:left;margin:.25rem 0;gap:1rem;padding:.3rem .8rem;border-radius:.7rem}
.listMode .tile.f{background:rgba(255,255,255,.2);transform:none}
.listMode .ic{width:2.5rem;height:2.5rem;line-height:2.5rem;margin:0;font-size:1.2rem;flex-shrink:0;text-align:center}   /* letter tiles (All apps, Settings) sit in the middle of the icon spot */
.listMode .nm{min-width:0}
.listMode .nm{font-size:1rem}
body.light.listMode .tile.f{background:rgba(0,0,0,.1)}
/* dock position (Dock and TV banner layouts; List keeps its own fixed spot). A top dock moves the clock to the bottom corner. */
body.fit:not(.listMode) #track{text-align:center}
body.fit:not(.listMode) #track .tile:last-child{margin-right:0}   /* the trailing gap would push the row off centre */   /* everything fits, so centre it; with more apps it scrolls as before */
body.dp-top:not(.listMode) #dock{bottom:auto;top:3rem}
body.dp-top:not(.listMode) #clock{top:auto;bottom:3rem}
body.dp-center:not(.listMode) #dock{bottom:auto;top:30%}   /* script centres it exactly (and keeps it clear of the clock) */

/* labels with Glass off sit on the bare photo, so their colour follows the photo, not the theme */
body.lbl-light:not(.glass) #dock{color:#f4f1e9}
body.lbl-dark:not(.glass) #dock{color:#191c20}
body.lbl-light:not(.glass) .nm{text-shadow:0 0 .35rem #000d,0 1px .2rem #000c,0 0 1rem #0008}
body.lbl-dark:not(.glass) .nm{text-shadow:0 0 .35rem #fffd,0 1px .2rem #fffc,0 0 1rem #fff8}
/* ---------- glass ----------
   Real frosted glass: JS paints the wallpaper's blurred -panel.jpg behind each panel, lined up with the photo,
   plus a veil whose strength was measured per photo (tools/gen_catalog.py). The rules below are only a fallback. */
.glass #dock,.glass .panel,.glass #all{background:rgba(22,27,32,.5);border:1px solid rgba(255,255,255,.18);box-shadow:0 1rem 3rem #0002}
.glass #dock{border-radius:1.2rem}
.glass.light #dock,.glass.light .panel,.glass.light #all{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.1)}

/* ---------- all apps ---------- */
#all{display:none;position:absolute;left:3rem;right:3rem;top:2rem;bottom:2.6rem;border-radius:1rem;background:rgba(20,25,29,.94);border:1px solid #ffffff26;overflow:hidden}
body.light #all{background:rgba(245,243,238,.94);border-color:#0002}
body.scr-all #all{display:block}
h1{margin:0;font-size:1.6rem;font-weight:300}
#all h1,.panel h1{position:absolute;left:2rem;top:1.2rem}
#gv{position:absolute;left:1.4rem;right:1rem;top:4.2rem;bottom:.8rem;overflow:hidden}
#grid{position:relative;padding:.8rem .6rem;transition:transform .22s ease-out;will-change:transform}
#grid .tile{margin-bottom:1.1rem}
#empty{display:none;position:absolute;left:2rem;top:5rem;opacity:.7}

/* ---------- settings / manage / hidden panels ---------- */
.panel{display:none;position:absolute;left:3rem;right:3rem;top:2rem;bottom:2.6rem;border-radius:1.2rem;background:rgba(20,25,29,.94);border:1px solid #ffffff26;overflow:hidden;box-shadow:0 1rem 4rem #0006}
body.light .panel{background:rgba(245,243,238,.96);border-color:#0002}
body.scr-settings #settings,body.scr-manage #manage,body.scr-hidden #hiddenp{display:block}
.pv{position:absolute;left:1.4rem;right:1.4rem;top:4.2rem;bottom:.8rem;overflow:hidden}
.pt{position:relative;padding:6px 8px 1rem;transition:transform .22s ease-out;will-change:transform}
.sec{margin:0 0 1.1rem}
.sec h2,.lh{font-size:.85rem;font-weight:500;opacity:.7;margin:.2rem 0 .6rem;letter-spacing:.06em}
.options{display:flex;gap:.6rem;flex-wrap:nowrap}
.opt{border:1px solid #ffffff30;background:#ffffff0b;color:inherit;padding:.65rem 1rem;border-radius:.55rem;font-size:.9rem;white-space:nowrap}
body.light .opt{border-color:#00000030;background:#0000000a}
.opt.sel{border-color:#d9c58b;background:#d9c58b22}
.opt.f,.wall.f,.li.f{outline:3px solid #e8d18e;outline-offset:2px}
.ws{overflow:hidden;padding:6px}
.wi{position:relative;display:flex;flex-wrap:nowrap;gap:.6rem;transition:transform .22s ease-out;will-change:transform}
.wall{flex:0 0 auto;width:8rem;height:4.5rem;border-radius:.5rem;border:2px solid transparent;background-size:cover;background-position:center;background-color:#222}
.wall.sel{border-color:#e8d18e}
#wname{opacity:.75;margin-top:.1rem;font-size:.9rem;height:1.2rem}
.li{display:flex;align-items:center;gap:1rem;padding:.6rem .9rem;margin:.3rem 6px;border-radius:.55rem;background:#ffffff0a;font-size:1rem}
body.light .li{background:#0000000a}
.li .nm2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tag{opacity:.6;font-size:.85rem}
.li.g{background:#d9c58b33}
.lh{margin:1rem 6px .4rem}
.infob{margin:.5rem 6px 0;font-size:.9rem;opacity:.82;line-height:1.6;white-space:pre-line}
.note{opacity:.7;margin:.2rem 6px .8rem;font-size:.95rem}

/* ---------- popup + toast + hint ---------- */
#ctx{display:none;position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5)}
#cbox{position:absolute;left:50%;top:50%;width:22rem;margin-left:-11rem;transform:translateY(-50%);background:rgba(26,30,34,.97);color:#fff;border-radius:1.1rem;padding:1.1rem}
#cbox h2{margin:.1rem .6rem .8rem;font-size:1.05rem;font-weight:500;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co{padding:.8rem 1rem;border-radius:.7rem;font-size:1.15rem}
.co.f{background:rgba(255,255,255,.22)}
#cnote{display:none;margin:.7rem .6rem .1rem;font-size:.85rem;opacity:.65;line-height:1.4}
#toast{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);max-width:44rem;background:#111e;color:#fff;padding:.6rem 1.2rem;border-radius:2rem;font-size:.95rem;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#hint{position:absolute;left:3rem;bottom:.6rem;font-size:.8rem;color:#fff;background:rgba(0,0,0,.45);padding:.2rem .8rem;border-radius:1rem;white-space:nowrap}
</style></head><body>
<div id="bg"></div>
<div id="clock"><div id="t"></div><span id="d"></span></div>
<div id="dock"><div id="track"></div></div>
<div id="all"><h1>All apps</h1><div id="gv"><div id="grid"></div></div><div id="empty">No apps to show. Hidden apps can be restored in Settings.</div></div>
<div id="settings" class="panel"><h1>Settings</h1><div class="pv" id="sv"><div class="pt" id="settingsBody"></div></div></div>
<div id="manage" class="panel"><h1>Home apps</h1><div class="pv" id="mv"><div class="pt" id="manageBody"></div></div></div>
<div id="hiddenp" class="panel"><h1>Hidden apps</h1><div class="pv" id="hv"><div class="pt" id="hiddenBody"></div></div></div>
<div id="ctx"><div id="cbox"><h2 id="ctitle"></h2><div id="copts"></div><div id="cnote"></div></div></div>
<div id="vpn" class="unk"><span class="vd"></span><span id="vt"></span></div>
<div id="art"><div class="al" id="al0"></div><div class="al" id="al1"></div><div id="artclock" class="c0"><div class="at" id="at"></div><div class="ad" id="ad"></div></div></div>
<div id="hint"></div><div id="toast"></div>
<script src="wallpaper/catalog.js"></script>
<script>

 for(var q=18;q<=46;q++)MK.push(['mock.app'+q,'Sample app '+q]);
 L={apps:function(){var a=[];for(var i=0;i<MK.length;i++)a.push({p:MK[i][0],n:MK[i][1]});return JSON.stringify(a)},icon:function(){return ''},getAutoApp:function(){try{return localStorage.getItem('mockAutoApp')||''}catch(e){return ''}},setAutoApp:function(p){try{localStorage.setItem('mockAutoApp',p||'')}catch(e){}console.log('auto app',p||'off')},getAutoSecs:function(){try{return +localStorage.getItem('mockAutoSecs')||10}catch(e){return 10}},setAutoSecs:function(s){try{localStorage.setItem('mockAutoSecs',''+s)}catch(e){}},runAutoApp:function(){console.log('run auto app');return true},network:function(){console.log('network settings')},launch:function(p){console.log('launch',p);if(p==='mock.app46')setTimeout(function(){window.onLaunchFail&&window.onLaunchFail(p)},50)},appInfo:function(){return 'none'},uninstall:function(p){return p.indexOf('com.amazon.')===0?'system':'none'},info:function(){return JSON.stringify({ver:'0.0-preview',code:0,sdk:28,rel:'9',model:'Browser preview',webview:'Chrome (preview)',service:false,takeover:true,free:3.2e9,total:8e9})},settings:function(){console.log('system settings')},vpn:function(){return JSON.stringify({on:location.hash.indexOf('vpn')>=0,id:'7'})},version:function(){return '0.0-preview'},exportSettings:function(j){try{localStorage.setItem('mockBackup',j)}catch(e){}setTimeout(function(){window.onBackup('export',true,'Downloads/FrameLauncher-settings.json')},100)},importSettings:function(){var j=null;try{j=localStorage.getItem('mockBackup')}catch(e){}setTimeout(function(){window.onBackup('import',!!j,j||'No backup file found in Downloads')},100)},backupExists:function(){var j=null;try{j=localStorage.getItem('mockBackup')}catch(e){}setTimeout(function(){window.onBackup('check',!!j,'')},100)},checkUpdate:function(){window.__updCalls=(window.__updCalls||0)+1;setTimeout(function(){window.onUpdate(window.__mockUpdate||JSON.stringify({ok:true,tag:'v0.0.0',url:'https://github.com/Mark-Stephen-Rose/FrameLauncher/releases/latest'}))},200)},homeState:function(){return JSON.stringify({service:false,takeover:true})},setTakeover:function(){},openStockHome:function(){return false},openAccessibility:function(){},geo:function(){setTimeout(function(){window.onGeo(JSON.stringify({ok:true,country:'Netherlands',cc:'NL',city:'Amsterdam'}))},400)}}}

var PREF=['com.netflix.ninja','com.amazon.firetv.youtube','com.verizon.fios.tvce'];

var KEEP=['com.amazon.tv.settings.v2','com.amazon.venezia','com.amazon.firetv.youtube','com.amazon.firebat','com.amazon.avod','com.amazon.avod.thirdpartyclient'];
/* file ids match app/src/main/assets/wallpaper/<id>.jpg and <id>-thumb.jpg */

var settings={listPos:'left',wall:0,theme:'dark',layout:'dock',display:'both',glass:true,font:100,focus:110,clock24:false,showClock:true,showDate:true,dock:'bottom',artIdle:0,artShow:0,artClock:true,vpn:'off',recent:true,shuffle:'off',updates:false};
var recent=[],ms=0,recentDirty=false,lastLaunch=null,hn=[],gn=[],mn=[],hln=[],mlist=[],hlist=[],offs={},homeDirty=false;

function load(){
 try{freshInstall=!localStorage.getItem('frameSettings')&&!localStorage.getItem('frameRestoreAsked')}catch(e){freshInstall=false}   // nothing saved yet = a first launch (after a reinstall, say)

  if(localStorage.getItem('frameDefaultsVersion')!=='2'){pins=PREF.slice(0,3);settings.wall=0;localStorage.setItem('frameDefaultsVersion','2')}}catch(e){pins=null}
 try{hidden=JSON.parse(localStorage.getItem('frameHidden')||'[]')||[]}catch(e){hidden=[]}

 try{var u=JSON.parse(localStorage.getItem('frameUpdate')||'null');if(u&&typeof u==='object'){upd.t=+u.t||0;upd.tag=typeof u.tag==='string'?u.tag:''}}catch(e){}

 if(typeof settings.wall!=='number'||settings.wall<0||settings.wall>=wallpapers.length)settings.wall=0;

 var b=['glass','clock24','showClock','showDate','artClock','recent','updates'];for(k=0;k<b.length;k++)if(typeof settings[b[k]]!=='boolean')settings[b[k]]=(b[k]==='clock24'||b[k]==='updates')?false:true}

/* ---------- appearance ---------- */

 $('bg').style.backgroundColor='#101315';$('bg').style.backgroundImage="url('"+wallSrc(settings.wall)+"')";
 if(settings.theme==='light')c.push('light');if(settings.layout==='list'){c.push('listMode');c.push('lp-'+settings.listPos)}if(settings.layout==='banner')c.push('bannerMode');

  else if(a==='auto'){var was=autoPkg()===p;try{L.setAutoApp(was?'':p)}catch(e){}refreshSettings();toast(was?'No app will open automatically':n+' will open at start-up and when the stick wakes')}
  else if(a==='info'){var r='none';try{r=L.appInfo?L.appInfo(p):'none'}catch(e){}if(r!=='ok')toast('App info isn\u2019t available on this device')}
  else if(a==='uninstall'){var u='none';try{u=L.uninstall?L.uninstall(p):'none'}catch(e){}
   if(u==='system')toast(n+' is part of the system and can\u2019t be uninstalled');else if(u!=='ok')toast('Uninstall isn\u2019t available here. Try the system Settings > Applications')}
  return true}
 else return false;
 ctxFocus();return true}

/* ---------- actions ---------- */
var appVer='';try{appVer=(L.version&&L.version())||'unknown'}catch(e){appVer='unknown'}
var importArm=0;
/* Export/import go through a file in Downloads, so it survives uninstalling the app. */
window.onBackup=function(kind,ok,data){
 if(kind==='check'){if(ok)openRestore();return}   // first-launch look for a backup: stay quiet unless one is there
 if(kind==='export'){toast(ok?'Settings saved to '+data:'Export failed: '+data);return}
 var was=restoring;restoring=false;
 if(!ok){toast(data);return}
 var j=null,k,st;try{j=JSON.parse(data)}catch(e){}
 if(!j||j.app!=='FrameLauncher'||!j.settings||typeof j.settings!=='object'){toast('That file is not a Frame Launcher backup');return}
 st=j.settings;for(k in settings)if(st.hasOwnProperty(k)&&typeof st[k]===typeof settings[k])settings[k]=st[k];
 fixSettings();
 if(j.pins instanceof Array)pins=j.pins.filter(function(p){return typeof p==='string'&&byPkg(p)});
 if(j.hidden instanceof Array)hidden=j.hidden.filter(function(p){return typeof p==='string'});
 hidden=hidden.filter(function(p){return pins.indexOf(p)<0});   // pinned wins, so an app is never on Home yet missing from All apps
 di=0;offs.home=0;save();applyLook();tick();lastAct=Date.now();rebuildAll();pollVpn();toast(was?'Settings restored':'Settings imported')};

/* ---------- restore on first launch ----------
   After a reinstall nothing is saved yet. Once, ask Android whether Downloads holds a backup (the first time this asks
   for storage access) and offer to restore it. Saying no, or having no backup, ends it; Settings > Import still works. */
function restoreCheck(){if(!freshInstall)return;freshInstall=false;
 try{localStorage.setItem('frameRestoreAsked','1')}catch(e){}
 try{if(L.backupExists)L.backupExists()}catch(e){}}
function openRestore(){if(ctx)return;ctx={sel:0,kind:'restore',o:[['restore','Restore from Downloads'],['skip','Not now']]};
 showCtx('Restore your settings?','Found FrameLauncher-settings.json in Downloads. It restores your look, pinned apps and hidden apps.')}

/* ---------- background shuffle ----------
   Daily: the first time Frame Launcher is looked at on a new calendar day. On wake: each time the stick wakes from sleep
   (and at start-up). Never while Settings is open, and never the same photo twice in a row. */
function pickWall(){var n=wallpapers.length,i;if(n<2)return settings.wall;do{i=Math.floor(Math.random()*n)}while(i===settings.wall);return i}
function shuffleNow(quiet){settings.wall=pickWall();save();applyLook();refreshSettings();if(!quiet)toast('Background: '+wallpapers[settings.wall][0])}
function dayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function markShuffleDay(){try{localStorage.setItem('frameShuffleDay',dayKey())}catch(e){}}
function shuffleDaily(){if(settings.shuffle!=='daily'||screen==='settings')return;var last='';
 try{last=localStorage.getItem('frameShuffleDay')||''}catch(e){}
 if(last===dayKey())return;markShuffleDay();if(last)shuffleNow(true)}

/* ---------- update check (opt-in) ----------
   Asks GitHub for the newest release (Java: checkUpdate) at most once a day, only if Updates is on, or when you press
   Check now. It only tells you; nothing is downloaded or installed. */
var REL_PAGE='github.com/Mark-Stephen-Rose/FrameLauncher/releases/latest';
function verNum(s){var m=String(s).replace(/^v/i,'').split('-')[0].split('.'),r=[],i;for(i=0;i<3;i++)r.push(parseInt(m[i],10)||0);return r}
function isNewer(a,b){var x=verNum(a),y=verNum(b),i;for(i=0;i<3;i++)if(x[i]!==y[i])return x[i]>y[i];return false}
function updAvailable(){return !!upd.tag&&isNewer(upd.tag,appVer)}
function vtxt(t){return String(t).replace(/^v/i,'')}
function updText(){
 if(upd.busy)return 'checking…';
 if(updAvailable())return 'version '+vtxt(upd.tag)+' is available (you have '+appVer+'). Download it from '+REL_PAGE;
 if(upd.t)return 'up to date (version '+appVer+')'+(settings.updates?' · checks once a day':' · automatic checks are off');
 return settings.updates?'on · will check soon':'off · opt-in: asks GitHub for the newest release once a day. Check now works any time'}
function updateCheck(manual){if(upd.busy)return;upd.busy=true;upd.manual=!!manual;refreshSettings();
 try{if(!L.checkUpdate)throw 0;L.checkUpdate()}catch(e){upd.busy=false;upd.manual=false;refreshSettings();if(manual)toast('Update check is not available here')}}
function maybeUpdate(){if(settings.updates&&!upd.busy&&Date.now()-upd.t>864e5)updateCheck(false)}
window.onUpdate=function(s){var j=null,man=upd.manual,seen='';upd.busy=false;upd.manual=false;try{j=JSON.parse(s)}catch(e){}
 if(!j||!j.ok||typeof j.tag!=='string'||!j.tag){upd.t=Date.now()-72000000;   // failed (offline?): try again in about 4 hours
  if(man)toast('Couldn’t check for updates. Is the stick online?');refreshSettings();return}
 upd.t=Date.now();upd.tag=j.tag;try{localStorage.setItem('frameUpdate',JSON.stringify({t:upd.t,tag:upd.tag}))}catch(e){}
 if(updAvailable()){try{seen=localStorage.getItem('frameUpdateSeen')||''}catch(e){}
  if(man||seen!==upd.tag){toast('Version '+vtxt(upd.tag)+' is available (you have '+appVer+')');try{localStorage.setItem('frameUpdateSeen',upd.tag)}catch(e){}}}
 else if(man)toast('You’re up to date (version '+appVer+')');
 refreshSettings();if(aboutTxt)loadAbout()};
var aboutTxt='';
function fmtB(b){return b>=1e9?(b/1e9).toFixed(1)+' GB':Math.round(b/1e6)+' MB'}
function creditsTxt(){var p=[],i,c;for(i=0;i<wallpapers.length;i++){c=CAT[wallpapers[i][1]];if(c&&c.credit)p.push(wallpapers[i][0]+' by '+c.credit)}
 return p.length?'Wallpaper photos from Unsplash: '+p.join(' · '):''}
function loadAbout(){var o=null,t;try{o=JSON.parse(L.info())}catch(e){}
 if(!o||o.ver===undefined)t='Details are shown when running on the device.';
 else t='Frame Launcher v'+o.ver+' (build '+o.code+')\nDevice: '+o.model+' · Android '+o.rel+' (API '+o.sdk+')\nWebView: '+(o.webview||'unknown')+
  '\nHome button: '+(o.service?'service running':'service off')+(o.takeover?' · takeover on':' · takeover off')+
  '\nStorage: '+fmtB(o.free)+' free of '+fmtB(o.total)+(o.free<5e8?' · very low. Uninstall apps you don\u2019t use (All apps > Menu)':o.free<1e9?' · getting low':'')+
  (updAvailable()?'\nUpdate: version '+vtxt(upd.tag)+' is available':'');
 var cr=creditsTxt();if(cr)t+='\n\n'+cr;
 aboutTxt=t;if(selEls.length)refreshSettings()}
function homeInfo(){try{return JSON.parse(L.homeState())}catch(e){return null}}
function onAction(a){
 if(a==='autooff'){try{L.setAutoApp('')}catch(e){}refreshSettings();toast('No app will open automatically');return}
 if(a==='autochoose'){go('all');toast('Press Menu on the app, then choose Open at start-up & wake');return}
 if(a==='autotest'){var ap=autoPkg(),ok=false;if(!ap){toast('Choose an app first');return}try{ok=L.runAutoApp()}catch(e){}if(!ok)toast('Couldn\u2019t open that app');return}
 if(a.indexOf('autosecs:')===0){try{L.setAutoSecs(+a.split(':')[1])}catch(e){}refreshSettings();return}
 if(a==='about'){loadAbout();toast('Details refreshed');return}
 if(a==='recentclear'){recent=[];try{localStorage.removeItem('frameRecent')}catch(e){}buildGrid();toast('Recent list cleared');return}
 if(a.indexOf('recent:')===0){settings.recent=a.split(':')[1]==='on';save();buildGrid();refreshSettings();return}
 if(a.indexOf('shuffle:')===0){settings.shuffle=a.split(':')[1];fixSettings();if(settings.shuffle==='daily')markShuffleDay();save();refreshSettings();
  toast(settings.shuffle==='daily'?'A new background each day':settings.shuffle==='wake'?'A new background each time the stick wakes':'Background shuffle is off');return}
 if(a==='shufflenow'){shuffleNow(false);return}
 if(a.indexOf('updates:')===0){settings.updates=a.split(':')[1]==='on';save();refreshSettings();if(settings.updates)maybeUpdate();return}
 if(a==='updatecheck'){updateCheck(true);return}
 if(a==='hometake'){var h=homeInfo();if(!h){toast('Not available here');return}try{L.setTakeover(!h.takeover)}catch(e){}refreshSettings();return}
 if(a==='homestock'){var ok=false;try{ok=L.openStockHome()}catch(e){}if(!ok)toast('Could not find the stock home screen');return}
 if(a==='a11y'){try{L.openAccessibility()}catch(e){}return}
 if(a==='export'){var o={app:'FrameLauncher',version:1,settings:settings,pins:pins,hidden:hidden};try{L.exportSettings(JSON.stringify(o))}catch(e){toast('Export is not available here')}return}
 if(a==='import'){if(Date.now()-importArm>6000){importArm=Date.now();toast('Press OK again to replace your current settings with the backup');return}importArm=0;try{L.importSettings()}catch(e){toast('Import is not available here')}return}
 if(a.indexOf('wall:')===0){settings.wall=+a.split(':')[1];save();applyLook();refreshSettings();toast('Background: '+wallpapers[settings.wall][0]);return}
 if(a.indexOf('theme:')===0){settings.theme=a.split(':')[1]}
 else if(a.indexOf('layout:')===0){settings.layout=a.split(':')[1];offs.home=0}
 else if(a.indexOf('display:')===0){settings.display=a.split(':')[1]}
 else if(a.indexOf('vpn:')===0){settings.vpn=a.split(':')[1];vpn.asked=0;vpn.fail=0;save();applyLook();pollVpn();refreshSettings();return}
 else if(a==='vpnrefresh'){if(settings.vpn==='off'){toast('Turn VPN status on first');return}vpn.loc=null;vpn.asked=0;vpn.fail=0;pollVpn();toast('Checking VPN…');return}
 else if(a.indexOf('artidle:')===0){settings.artIdle=+a.split(':')[1];lastAct=Date.now()}
 else if(a.indexOf('artshow:')===0){settings.artShow=+a.split(':')[1]}
 else if(a==='artclock'){settings.artClock=!settings.artClock}
 else if(a==='artnow'){startArt();return}
 else if(a.indexOf('dock:')===0){settings.dock=a.split(':')[1]}
 else if(a.indexOf('listpos:')===0){settings.listPos=a.split(':')[1]}
 else if(a.indexOf('clock:')===0){settings.clock24=a.split(':')[1]==='24'}
 else if(a==='showclock'){settings.showClock=!settings.showClock}
 else if(a==='showdate'){settings.showDate=!settings.showDate}
 else if(a==='glass'){settings.glass=!settings.glass}
 else if(a.indexOf('font:')===0){settings.font=Math.max(80,Math.min(130,settings.font+(a.indexOf('+')>=0?10:-10)))}
 else if(a.indexOf('focus:')===0){settings.focus=Math.max(90,Math.min(140,settings.focus+(a.indexOf('+')>=0?10:-10)))}
 else if(a==='manage'){grab=false;mi=0;go('manage');return}
 else if(a==='hiddenscr'){hi=0;go('hidden');return}
 else if(a==='stock'){hideStock(false);return}
 else if(a==='system'){try{L.settings()}catch(e){}toast('Opening the Fire TV settings \u00b7 press Back to return here');return}
 else if(a==='network'){try{L.network()}catch(e){}toast('Opening network settings \u00b7 press Back to return here');return}
 else if(a==='close'){go('home');return}
 save();applyLook();tick();rebuildAll()}
function rebuildAll(){recompute();buildHome();buildGrid();refreshSettings();if(screen==='manage')buildManage();if(screen==='hidden')buildHidden()}
function go(s){screen=s;ctx=null;grab=false;$('ctx').style.display='none';applyLook();
 if(homeDirty&&(s==='home'||s==='all')){buildHome();buildGrid();homeDirty=false}
 if(s==='manage')buildManage();else if(s==='hidden')buildHidden();else if(s==='settings'){loadAbout();focusSet()}else if(s==='all'){buildGrid();focusGrid()}else{fitDock();focusHome()}hints()}
function activate(a){if(!a)return;if(a.p==='__all'){ai=0;offs.grid=0;go('all')}else if(a.p==='__settings')go('settings');else launchApp(a.p)}

/* ---------- native hooks (Back / Home / Menu) ---------- */
window.onBack=function(){
 lastAct=Date.now();if(artOn){stopArt();return}
 if(ctx){closeCtx();return}
 if(grab){grab=false;focusMan();hints();return}
 if(screen==='manage'||screen==='hidden')go('settings');else if(screen!=='home')go('home')};
window.onHome=function(){lastAct=Date.now();if(artOn)stopArt();di=0;offs.home=0;go('home')};
window.onMenu=function(){
 lastAct=Date.now();if(artOn){stopArt();return}
 if(ctx){closeCtx();return}
 if(screen==='manage'){var it=mlist[mi];if(it&&it.pin){pins.splice(pins.indexOf(it.p),1);save();grab=false;homeDirty=true;buildManage();toast('Unpinned')}return}
 if(screen==='hidden'){unhide(hi);return}
 if(screen==='all'){openCtx();return}
 if(screen==='home'){var a=dockItems()[di];if(a&&a.p.indexOf('__')!==0){pins.splice(di,1);save();buildHome();buildGrid();toast('Unpinned '+a.n)}}};

/* ---------- keys ---------- */
document.addEventListener('click',function(e){lastAct=Date.now();if(artOn){stopArt();return}var t=e.target;while(t&&t!==document){if(t.getAttribute){var a=t.getAttribute('data-action');if(a){onAction(a);return}}t=t.parentNode}});
document.addEventListener('keydown',function(e){var k=e.keyCode,ok=false;
 lastAct=Date.now();if(artOn){stopArt();e.preventDefault();return}   // the key that wakes art mode does nothing else
 if(mock){if(k===27||k===8){onBack();e.preventDefault();return}if(k===77){onMenu();e.preventDefault();return}}
 if(ctx)ok=ctxKey(k);
 else if(screen==='settings')ok=setKey(k);
 else if(screen==='manage')ok=manKey(k);
 else if(screen==='hidden')ok=hidKey(k);
 else if(screen==='all'){var n=gn.length,o=ai;
  if(k===37)ai=Math.max(0,ai-1);else if(k===39)ai=Math.min(n-1,ai+1);
  else if(k===38)ai=gridMove(-1);else if(k===40)ai=gridMove(1);
  else if(k===13||k===23){var ga=gnApp(ai);if(ga)launchApp(ga.p)}else ok=null;
  if(ok!==null){ok=true;if(ai!==o)focusGrid()}else ok=false}
 else{var list=settings.layout==='list',prev=list?38:37,next=list?40:39;
  if(k===prev){di=Math.max(0,di-1);focusHome();ok=true}else if(k===next){di=Math.min(hn.length-1,di+1);focusHome();ok=true}
  else if(k===13||k===23){activate(dockItems()[di]);ok=true}}
 if(ok)e.preventDefault()});

/* ---------- apps + clock ---------- */
window.refreshApps=function(){var s;try{s=L.apps()}catch(e){s='[]'}
 if(s===lastJson)return;lastJson=s;
 try{apps=JSON.parse(s)}catch(e){apps=[]}
 apps.sort(function(a,b){return a.n.toLowerCase()<b.n.toLowerCase()?-1:1});
 if(!pins){pins=[];for(var j=0;j<PREF.length&&pins.length<8;j++)if(byPkg(PREF[j]))pins.push(PREF[j]);for(var k=0;k<apps.length&&pins.length<6;k++)if(pins.indexOf(apps[k].p)<0)pins.push(apps[k].p)}
 pins=pins.filter(byPkg);hidden=hidden.filter(function(p){return pins.indexOf(p)<0});
 try{if(apps.length&&!localStorage.getItem('frameHideV1')){hideStock(true);localStorage.setItem('frameHideV1','1')}}catch(e){}
 save();recompute();applyLook();buildHome();buildGrid();if(screen==='manage')buildManage();if(screen==='hidden')buildHidden();refreshSettings();hints()};
/* ---------- art mode ----------
   After the chosen idle time, a full-screen wallpaper (still, or a slideshow) with a small clock. Any key wakes it and is
   swallowed, so waking never presses a button. The clock hops to another corner every couple of minutes. */
var artOn=false,lastAct=Date.now(),lastChk=Date.now(),artIdx=0,artFront=0,artTimer=null,artClk=null;
function timeStr(n){var h=settings.clock24?n.getHours():(n.getHours()%12||12),m=n.getMinutes();return (settings.clock24&&h<10?'0':'')+h+':'+(m<10?'0':'')+m}
function dateStr(n){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n.getDay()]+', '+['January','February','March','April','May','June','July','August','September','October','November','December'][n.getMonth()]+' '+n.getDate()}
function artTick(){var n=new Date(),c=$('artclock');$('at').textContent=timeStr(n);$('ad').textContent=dateStr(n);
 c.className='c'+(Math.floor(n.getTime()/120000)%4);c.style.display=settings.artClock?'block':'none'}
function artNext(){var i=(artIdx+1)%wallpapers.length,im=new Image();
 im.onload=function(){if(!artOn)return;var f=artFront,nb=$('al'+(1-f)),ob=$('al'+f);
  nb.style.backgroundImage="url('"+wallSrc(i)+"')";nb.style.opacity=1;ob.style.opacity=0;artFront=1-f;artIdx=i};
 im.onerror=function(){artIdx=i};                         // a missing photo is skipped
 im.src=wallSrc(i)}
function startArt(){if(artOn)return;artOn=true;artIdx=settings.wall;artFront=0;
 $('al0').style.backgroundImage="url('"+wallSrc(artIdx)+"')";$('al0').style.opacity=1;$('al1').style.opacity=0;
 $('art').style.display='block';artTick();artClk=setInterval(artTick,15000);
 if(settings.artShow>0)artTimer=setInterval(artNext,settings.artShow*1000);
 try{if(L.art)L.art(true)}catch(e){}}
function stopArt(){if(!artOn)return;artOn=false;clearInterval(artTimer);clearInterval(artClk);artTimer=artClk=null;
 $('art').style.display='none';$('al0').style.backgroundImage='';$('al1').style.backgroundImage='';lastAct=Date.now();
 try{if(L.art)L.art(false)}catch(e){}}
window.onWake=function(){lastAct=Date.now();stopArt()};
window.onResume=function(woke){lastAct=Date.now();lastChk=lastAct;stopArt();pollVpn();   // woke: the stick slept since Frame Launcher was last in front
 if(recentDirty){recentDirty=false;if(screen==='all')buildGrid(lastLaunch&&lastLaunch.p,lastLaunch&&lastLaunch.inRecent)}
 if(woke===true&&settings.shuffle==='wake'&&screen!=='settings')shuffleNow(true);
 shuffleDaily();maybeUpdate()};
setInterval(function(){var n=Date.now();
 if(n-lastChk>15000)lastAct=n;                            // timers were paused (another app, TV asleep): that is not idle time
 lastChk=n;if(!artOn&&settings.artIdle>0&&n-lastAct>settings.artIdle*60000)startArt()},5000);

/* ---------- VPN status ----------
   Android says whether a VPN tunnel is up (L.vpn, no network traffic). Only then is the exit location looked up online
   (L.geo), once per new tunnel and then every 10 minutes. The IP address itself is never shown or stored. */
var vpn={on:false,id:'',err:false,loc:null,seen:false,busy:false,asked:0,fail:0};
function renderVpn(){var el=$('vpn'),c,t;if(settings.vpn==='off')return;
 if(!vpn.seen){c='unk';t='VPN · checking…'}
 else if(vpn.err){c='unk';t='VPN status unavailable'}
 else if(!vpn.on){c='off';t='VPN off'}
 else if(vpn.loc){c='on';t='VPN · '+(settings.vpn==='city'&&vpn.loc.city?vpn.loc.city+', ':'')+vpn.loc.country}
 else if(vpn.fail&&!vpn.busy){c='on';t='VPN on · location unavailable'}
 else{c='on';t='VPN on · locating…'}
 el.className=c;$('vt').textContent=t}
function geoAsk(){if(vpn.busy)return;vpn.busy=true;vpn.asked=Date.now();
 try{L.geo()}catch(e){vpn.busy=false;vpn.fail++}}
window.onGeo=function(s){var j=null;vpn.busy=false;try{j=JSON.parse(s)}catch(e){}
 if(j&&j.ok&&j.country){vpn.loc={country:j.country,city:j.city||''};vpn.fail=0}else vpn.fail++;
 renderVpn()};
function pollVpn(){if(settings.vpn==='off')return;var r=null,n=Date.now();
 try{r=L.vpn?JSON.parse(L.vpn()):null}catch(e){}
 vpn.seen=true;
 if(!r){vpn.err=true;vpn.on=false;renderVpn();return}
 vpn.err=!!r.err;
 if(!r.on){vpn.on=false;vpn.id='';vpn.loc=null;vpn.fail=0;vpn.asked=0;renderVpn();return}
 if(!vpn.on||r.id!==vpn.id){vpn.on=true;vpn.id=r.id;vpn.loc=null;vpn.fail=0;vpn.asked=0}   // a new tunnel: the old location no longer applies
 if(vpn.asked===0||n-vpn.asked>(vpn.loc?600000:Math.min(15000*(1+vpn.fail),120000)))geoAsk();
 renderVpn()}
setInterval(function(){if(!artOn)pollVpn()},10000);
setInterval(function(){shuffleDaily()},60000);          // a new day can start while the launcher is on screen
setInterval(function(){maybeUpdate()},3600000);

function tick(){var n=new Date();
 $('t').textContent=timeStr(n);
 $('d').textContent=dateStr(n)}
load();tick();setInterval(tick,20000);buildSettings();refreshApps();pollVpn();
/* start-up: On wake also counts a fresh start (boot, or the system closed the launcher while the TV slept) */
if(settings.shuffle==='wake')shuffleNow(true);else shuffleDaily();
maybeUpdate();restoreCheck();
window.onresize=function(){fitDock();focusHome();applyFrost()};
})();
</script></body></html>
