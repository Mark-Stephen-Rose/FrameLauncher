plugins { id 'com.android.application' }
android {
    namespace 'com.example.framelauncher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.framelauncher'
        minSdk 22
        targetSdk 28   // Fire OS 7 = Android 9; avoids package-visibility limits
        versionCode 3
        versionName '0.3'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
