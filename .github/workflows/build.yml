name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  ui-tests:
    # Opens the launcher page in a headless browser and drives it with the keyboard: every setting, the layouts, backup
    # import, the restore prompt, shuffle and the update check. It runs before the APK is built, so a broken page stops here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: npm test
        working-directory: tests
  build:
    needs: ui-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FrameLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
